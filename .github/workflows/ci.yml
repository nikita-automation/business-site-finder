name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Unit tests
        run: python -m unittest discover -s tests
        env:
          PYTHONPATH: src

      - name: Sample-data pipeline runs end to end
        run: |
          python -m bsf collect --source sample
          python -m bsf analyze
          python -m bsf leads --top 5
          python -m bsf demo --top 5
          python -m bsf report
        env:
          PYTHONPATH: src
